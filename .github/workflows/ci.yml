name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: |
          uv sync --group dev
      
      - name: Run ruff linter
        run: |
          uv run ruff check src/ tests/ examples/
      
      - name: Run ruff formatter check
        run: |
          uv run ruff format --check src/ tests/ examples/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: |
          uv sync --group dev
      
      - name: Run mypy
        run: |
          uv run mypy src/plotext_plus

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: |
          uv sync --group dev
      
      - name: Run tests with coverage
        run: |
          uv run pytest --cov=src/plotext_plus --cov-report=xml --cov-report=term-missing -v
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  test-mcp:
    name: Test MCP Functionality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies with MCP support
        run: |
          uv sync --extra mcp
      
      - name: Test MCP imports
        run: |
          python -c "from plotext_plus.mcp_server import start_server; print('✅ MCP import successful')"
      
      - name: Test MCP CLI
        run: |
          plotext-mcp --info
      
      - name: Test MCP functionality
        run: |
          python -c "
          import asyncio
          from plotext_plus.mcp_server import scatter_plot, line_plot, get_available_themes
          
          async def test_mcp():
              # Test scatter plot
              result1 = await scatter_plot([1,2,3], [1,4,9], title='Test Scatter')
              assert len(result1) > 100, 'Scatter plot should generate output'
              
              # Test line plot
              result2 = await line_plot([1,2,3,4], [2,4,6,8], title='Test Line')
              assert len(result2) > 100, 'Line plot should generate output'
              
              # Test themes
              themes = await get_available_themes()
              assert isinstance(themes, dict), 'Themes should be a dictionary'
              assert len(themes) > 0, 'Should have at least one theme'
              
              print('✅ All MCP functionality tests passed')
          
          asyncio.run(test_mcp())
          "

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: |
          uv sync --group dev
      
      - name: Run bandit security check
        run: |
          uv run bandit -r src/ -f json -o bandit-report.json || true
          uv run bandit -r src/

  examples:
    name: Test Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies with all extras
        run: |
          uv sync --all-extras
      
      - name: Test examples run without errors
        run: |
          # Test that examples can be imported and basic functionality works
          python -c "
          import sys
          sys.path.insert(0, 'src')
          
          # Test basic plotting functionality
          import plotext_plus as plt
          plt.scatter([1, 2, 3], [1, 4, 9])
          plt.title('Test Plot')
          output = plt.show()
          assert len(output) > 100, 'Plot should generate substantial output'
          print('✅ Basic plotting test passed')
          
          # Test themes
          plt.theme('chuk_default')
          plt.clear_figure()
          plt.plot([1, 2, 3], [1, 2, 3])
          themed_output = plt.show()
          assert len(themed_output) > 100, 'Themed plot should generate output'
          print('✅ Theme test passed')
          "

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-mcp, security, examples]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: |
          uv sync --group dev
      
      - name: Build package
        run: |
          uv build
      
      - name: Check package with twine
        run: |
          uv run twine check dist/*
      
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  container:
    name: Test Container Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mcp
          tags: plotext-plus/mcp:test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test container
        run: |
          docker run --rm plotext-plus/mcp:test python3 -c "import plotext_plus.mcp_server; print('✅ Container MCP import successful')"