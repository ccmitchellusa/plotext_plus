[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
ignore_missing_imports = True

# Specific module configurations for gradual typing

# Modules with good type coverage - enforce stricter checks
[mypy-plotext_plus._themes]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# MCP server has good type hints but complex dependencies
[mypy-plotext_plus.mcp_server]
disallow_untyped_defs = False
ignore_errors = True

# Public API modules - gradually increase strictness
[mypy-plotext_plus.themes]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-plotext_plus.charts]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-plotext_plus.plotting]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-plotext_plus.utilities]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Test and example files - keep permissive
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-examples.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Third-party packages without stubs
[mypy-chuk_mcp_server.*]
ignore_missing_imports = True

[mypy-chuk_term.*]
ignore_missing_imports = True

[mypy-shtab.*]
ignore_missing_imports = True